name: Android CI and preview release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK packages
        shell: bash
        run: bash scripts/setup-android-ci.sh

      - name: Verify Gradle wrapper
        shell: bash
        run: sha256sum --check gradle/wrapper/gradle-wrapper.jar.sha256

      - name: Run unit tests, lint and build debug APK
        shell: bash
        run: bash ./gradlew --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload installable debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WortWerk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  preview-release:
    name: Prepare draft prerelease
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download tested APK
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WortWerk-debug
          path: release

      - name: Prepare APK and checksum
        shell: bash
        run: |
          mv release/app-debug.apk release/WortWerk-debug.apk
          (cd release && sha256sum WortWerk-debug.apk > SHA256SUMS.txt)

      - name: Create or update draft prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cat > release/notes.md <<'NOTES'
          WortWerk Android preview build.

          Install WortWerk-debug.apk on Android 8.0 or newer. This is a debug-signed
          test build, not a production or Play Store release. CI uses a temporary
          debug key: installing over a build signed with another key may require
          uninstalling that build first, which removes its local learning progress.

          Unit tests, Android lint and APK build passed in this workflow.
          SHA256SUMS.txt contains the APK checksum.
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > release/existing.json; then
            if ! jq -e '.isDraft == true' release/existing.json > /dev/null; then
              echo "Release already published; leaving it unchanged."
              exit 0
            fi
            gh release upload "$RELEASE_TAG" release/WortWerk-debug.apk release/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" release/WortWerk-debug.apk release/SHA256SUMS.txt \
              --verify-tag --draft --prerelease --title "WortWerk $RELEASE_TAG preview" \
              --notes-file release/notes.md
          fi
